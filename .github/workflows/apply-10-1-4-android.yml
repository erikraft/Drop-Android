name: apply-10-1-4-android
on:
  push:
    branches: [fix/drop-10.1.4-android-final]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Android changes without rewriting existing files
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          root=Path('.')
          def rw(path, fn):
              p=root/path; s=p.read_text(encoding='utf-8'); n=fn(s); p.write_text(n,encoding='utf-8'); return n
          rw('app/build.gradle', lambda s: re.sub(r'versionCode\s+\d+\s+versionName\s+"[^"]+"','versionCode 27\n        versionName "10.1.4"',s,count=1))
          rw('README.md', lambda s: s.replace('`10.1.3` (version code `26`)', '`10.1.4` (version code `27`)'))
          rw('app/src/main/AndroidManifest.xml', lambda s: s.replace('android:allowBackup="false"','android:allowBackup="false"\n        android:extractNativeLibs="true"',1).replace('        <activity android:name=".OnionTransferActivity" android:exported="false" />','        <activity android:name=".DiagnosticsActivity" android:exported="false" android:label="@string/diagnostics_title" />\n        <activity android:name=".OnionTransferActivity" android:exported="false" />',1))
          rw('app/src/main/res/values/strings.xml', lambda s: s.replace('</resources>','''    <string name="diagnostics_title">Diagnósticos</string>\n    <string name="diagnostics_summary">Ative os diagnósticos para visualizar os logs do aplicativo</string>\n    <string name="diagnostics_enabled_summary">Logs de diagnóstico habilitados</string>\n    <string name="diagnostics_open">Abrir diagnósticos</string>\n    <string name="diagnostics_refresh">Atualizar</string>\n    <string name="diagnostics_copy">Copiar</string>\n    <string name="diagnostics_save">Baixar .txt</string>\n    <string name="diagnostics_copied">Diagnósticos copiados.</string>\n    <string name="diagnostics_saved">Arquivo de diagnósticos salvo.</string>\n    <string name="diagnostics_disabled">Habilite Diagnósticos nas Configurações para visualizar os logs.</string>\n    <string name="pref_diagnostics_enabled" translatable="false">diagnostics_enabled</string>\n    <string name="pref_diagnostics_open" translatable="false">diagnostics_open</string>\n</resources>''',1))
          rw('app/src/main/res/xml/preferences.xml', lambda s: s.replace('    </PreferenceCategory>', '''        <SwitchPreferenceCompat\n            android:defaultValue="false"\n            android:key="@string/pref_diagnostics_enabled"\n            android:summary="@string/diagnostics_summary"\n            android:title="@string/diagnostics_title" />\n        <Preference\n            android:key="@string/pref_diagnostics_open"\n            android:summary="@string/diagnostics_enabled_summary"\n            android:title="@string/diagnostics_open" />\n    </PreferenceCategory>''',1))
          rw('app/src/main/java/com/erikraft/drop/SettingsFragment.java', lambda s: s.replace('        prefs = PreferenceManager.getDefaultSharedPreferences(getContext());','''        prefs = PreferenceManager.getDefaultSharedPreferences(getContext());\n\n        final Preference diagnosticsEnabled = findPreference(getString(R.string.pref_diagnostics_enabled));\n        final Preference diagnosticsOpen = findPreference(getString(R.string.pref_diagnostics_open));\n        if (diagnosticsEnabled != null && diagnosticsOpen != null) {\n            diagnosticsOpen.setEnabled(prefs.getBoolean(diagnosticsEnabled.getKey(), false));\n            diagnosticsEnabled.setOnPreferenceChangeListener((pref, value) -> { diagnosticsOpen.setEnabled((Boolean) value); return true; });\n            diagnosticsOpen.setOnPreferenceClickListener(pref -> {\n                if (!prefs.getBoolean(diagnosticsEnabled.getKey(), false)) { Snackbar.make(requireView(), R.string.diagnostics_disabled, Snackbar.LENGTH_LONG).show(); return true; }\n                startActivity(new Intent(requireContext(), DiagnosticsActivity.class)); return true;\n            });\n        }''',1))
          rw('app/src/main/java/com/erikraft/drop/TorController.java', lambda s: s.replace('                AndroidTorWrapper currentTor = tor;\n                currentTor.start();','''                AndroidTorWrapper currentTor = tor;\n                logNativeRuntimeState();\n                currentTor.start();''',1).replace('    private static String architecture() {','''    private void logNativeRuntimeState() {\n        try {\n            File dir = new File(application.getApplicationInfo().nativeLibraryDir);\n            File torLib = new File(dir, "libtor.so");\n            Log.i(TAG, "nativeLibraryDir=" + dir.getAbsolutePath());\n            Log.i(TAG, "libtor.so exists=" + torLib.exists() + ", readable=" + torLib.canRead() + ", executable=" + torLib.canExecute() + ", length=" + torLib.length());\n            Log.i(TAG, "ABIs=" + java.util.Arrays.toString(Build.SUPPORTED_ABIS) + ", sdk=" + Build.VERSION.SDK_INT);\n        } catch (Exception e) { Log.w(TAG, "Tor native diagnostics failed", e); }\n    }\n\n    private static String architecture() {''',1))
          diag='''package com.erikraft.drop;\n\nimport android.content.ClipData;\nimport android.content.ClipboardManager;\nimport android.content.Context;\nimport android.os.Bundle;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\nimport android.widget.TextView;\nimport android.widget.Toast;\nimport androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.appcompat.widget.Toolbar;\nimport androidx.preference.PreferenceManager;\nimport com.google.android.material.button.MaterialButton;\nimport java.nio.charset.StandardCharsets;\n\npublic class DiagnosticsActivity extends AppCompatActivity {\n    private TextView logs; private String currentLogs=""; private ActivityResultLauncher<String> saver;\n    @Override protected void onCreate(Bundle state) { super.onCreate(state); SnapdropApplication.setAppTheme(this);\n        saver=registerForActivityResult(new ActivityResultContracts.CreateDocument("text/plain"), uri->{ if(uri==null)return; try(java.io.OutputStream out=getContentResolver().openOutputStream(uri)){ if(out==null)throw new java.io.IOException("No output stream"); out.write(currentLogs.getBytes(StandardCharsets.UTF_8)); Toast.makeText(this,R.string.diagnostics_saved,Toast.LENGTH_SHORT).show(); }catch(Exception e){Toast.makeText(this,"Falha ao salvar: "+e.getMessage(),Toast.LENGTH_LONG).show();} });\n        LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); Toolbar bar=new Toolbar(this); bar.setTitle(R.string.diagnostics_title); bar.setNavigationIcon(androidx.appcompat.R.drawable.abc_ic_ab_back_material); bar.setNavigationOnClickListener(v->finish()); root.addView(bar,new LinearLayout.LayoutParams(-1,getResources().getDimensionPixelSize(com.google.android.material.R.dimen.mtrl_toolbar_default_height))); setSupportActionBar(bar);\n        LinearLayout actions=new LinearLayout(this); MaterialButton refresh=button(R.string.diagnostics_refresh), copy=button(R.string.diagnostics_copy), save=button(R.string.diagnostics_save); actions.addView(refresh); actions.addView(copy); actions.addView(save); root.addView(actions); ScrollView scroll=new ScrollView(this); logs=new TextView(this); logs.setTextIsSelectable(true); logs.setTypeface(android.graphics.Typeface.MONOSPACE); logs.setTextSize(12); scroll.addView(logs); root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1)); setContentView(root);\n        refresh.setOnClickListener(v->refreshLogs()); copy.setOnClickListener(v->{ClipboardManager cm=(ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE); if(cm!=null)cm.setPrimaryClip(ClipData.newPlainText("ErikrafT Drop diagnostics",currentLogs)); Toast.makeText(this,R.string.diagnostics_copied,Toast.LENGTH_SHORT).show();}); save.setOnClickListener(v->saver.launch("erikraft-drop-diagnostics.txt")); refreshLogs();\n    }\n    private void refreshLogs(){boolean enabled=PreferenceManager.getDefaultSharedPreferences(this).getBoolean(getString(R.string.pref_diagnostics_enabled),false); currentLogs=enabled?com.erikraft.drop.utils.LogUtils.getLogs(PreferenceManager.getDefaultSharedPreferences(this),true):getString(R.string.diagnostics_disabled); logs.setText(currentLogs);}\n    private MaterialButton button(int id){MaterialButton b=new MaterialButton(this);b.setText(id);return b;}\n}\n'''
          (root/'app/src/main/java/com/erikraft/drop/DiagnosticsActivity.java').write_text(diag,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]']); subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com']); subprocess.run(['git','add','-A']); subprocess.run(['git','commit','-m','fix: add diagnostics and harden Android Tor startup'],check=False); wf=root/'.github/workflows/apply-10-1-4-android.yml'; wf.unlink(missing_ok=True); subprocess.run(['git','add','-A']); subprocess.run(['git','commit','-m','chore: remove temporary Android migration workflow'],check=False); subprocess.run(['git','push'])
