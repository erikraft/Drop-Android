name: Build and Upload APK to Release

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - feat/webtorrent-onion-webview-beta
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK command-line tools
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not configured on the runner." >&2
            exit 1
          fi

          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --stacktrace --warning-mode all --info

      - name: Verify Tor and Lyrebird native libraries in APK
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK was generated under app/build/outputs/apk." >&2
            exit 1
          fi

          TOR_FOUND=0
          LYREBIRD_FOUND=0
          for APK in "${APKS[@]}"; do
            echo "Checking Tor/Lyrebird native libraries in: $APK"
            ZIP_CONTENTS="$(unzip -Z1 "$APK")"

            if printf '%s\n' "$ZIP_CONTENTS" | grep -qE '^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libtor\.so$'; then
              echo "Found libtor.so in $APK"
              printf '%s\n' "$ZIP_CONTENTS" | grep -E '^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libtor\.so$'
              TOR_FOUND=1
            else
              echo "No libtor.so found in $APK"
            fi

            if printf '%s\n' "$ZIP_CONTENTS" | grep -qE '^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/liblyrebird\.so$'; then
              echo "Found liblyrebird.so in $APK"
              printf '%s\n' "$ZIP_CONTENTS" | grep -E '^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/liblyrebird\.so$'
              LYREBIRD_FOUND=1
            else
              echo "No liblyrebird.so found in $APK"
            fi
          done

          if [ "$TOR_FOUND" -ne 1 ]; then
            echo "ERROR: No generated APK contains libtor.so for a supported ABI." >&2
            exit 1
          fi

          if [ "$LYREBIRD_FOUND" -ne 1 ]; then
            echo "ERROR: No generated APK contains liblyrebird.so for a supported ABI." >&2
            echo "The Onion Wrapper requires the native Lyrebird transport at runtime." >&2
            exit 1
          fi

      - name: Upload debug APK as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Upload release APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
