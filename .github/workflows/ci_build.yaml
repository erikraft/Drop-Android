name: Build Android

on:
  push:
    branches:
      - master
      - feat/webtorrent-onion-webview-beta
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --stacktrace --warning-mode all --info

      - name: Verify debug APK and Tor native libraries
        shell: bash
        run: |
          APK="app/build/outputs/apk/mobile/debug/Drop-Android.apk"
          if [ ! -f "$APK" ]; then
            echo "Debug APK not found: $APK"
            find app/build/outputs -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libtor\.so$'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Drop-Android-debug
          path: app/build/outputs/apk/mobile/debug/Drop-Android.apk
          if-no-files-found: error

      - name: Upload release artifact when available
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Drop-Android-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn
