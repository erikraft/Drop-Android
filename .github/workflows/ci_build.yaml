name: CI Build

on:
  push:
    branches:
      - master
      - beta
      - 'release/**'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --stacktrace --warning-mode all --info

      - name: Verify Tor and Lyrebird native libraries in APK
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK was generated under app/build/outputs/apk." >&2
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            echo "Checking Tor/Lyrebird native library pairs in: $APK"
            ZIP_CONTENTS="$(unzip -Z1 "$APK")"

            # Use here-strings instead of printf | grep -q. With pipefail enabled,
            # grep -q can exit early and make printf receive SIGPIPE (Broken pipe).
            mapfile -t PACKAGED_ABIS < <(
              grep -E '^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/' <<< "$ZIP_CONTENTS" \
                | cut -d/ -f2 \
                | sort -u
            )

            if [ "${#PACKAGED_ABIS[@]}" -eq 0 ]; then
              echo "ERROR: $APK contains no supported native ABI directory." >&2
              exit 1
            fi

            for ABI in "${PACKAGED_ABIS[@]}"; do
              TOR_PATH="lib/$ABI/libtor.so"
              LYREBIRD_PATH="lib/$ABI/liblyrebird.so"
              echo "Checking ABI $ABI: $TOR_PATH + $LYREBIRD_PATH"

              TOR_PRESENT=0
              LYREBIRD_PRESENT=0
              if grep -Fxq "$TOR_PATH" <<< "$ZIP_CONTENTS"; then
                TOR_PRESENT=1
              fi
              if grep -Fxq "$LYREBIRD_PATH" <<< "$ZIP_CONTENTS"; then
                LYREBIRD_PRESENT=1
              fi

              if [ "$TOR_PRESENT" -ne 1 ] || [ "$LYREBIRD_PRESENT" -ne 1 ]; then
                echo "ERROR: $APK has an incomplete Tor/Lyrebird pair for ABI $ABI." >&2
                echo "  libtor.so: $([ "$TOR_PRESENT" -eq 1 ] && echo present || echo missing)" >&2
                echo "  liblyrebird.so: $([ "$LYREBIRD_PRESENT" -eq 1 ] && echo present || echo missing)" >&2
                echo "The Onion Wrapper requires both native libraries for every packaged ABI." >&2
                exit 1
              fi

              echo "Validated ABI $ABI: both native libraries are packaged."
            done
          done

      - name: Upload debug APK as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Upload release APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}