name: Fix ErikrafT Drop Android beta

on:
  push:
    branches:
      - feat/webtorrent-onion-webview-beta

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/workflows/fix_beta_compile.py
      - run: python3 .github/workflows/fix_beta_compile2.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/erikraft/drop/OnboardingFragment2.java app/src/main/java/com/erikraft/drop/TorController.java app/src/main/java/com/erikraft/drop/OnionTransferActivity.java
          git diff --cached --quiet || git commit -m 'fix: correct Android beta compile errors'
          git push
