name: Signed APK + AAB Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Manual version to validate against versionName (Optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Conditions
    runs-on: ubuntu-latest
    if: github.repository == 'erikraft/Drop-Android'
    outputs:
      version_tag: ${{ steps.get_version.outputs.tag }}
      is_tag_release: ${{ steps.get_version.outputs.is_tag_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get release version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v-manual" >> "$GITHUB_OUTPUT"
            echo "is_tag_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version matches app/build.gradle
        run: |
          # Robust extraction of versionName from app/build.gradle
          VERSION_NAME=$(python3 -c "import re; content = open('app/build.gradle').read(); match = re.search(r'versionName\s+[\"\']([^\"\'\s]+)[\"\']', content); print(match.group(1) if match else '')")

          if [ -z "$VERSION_NAME" ]; then
            echo "❌ Error: Could not parse versionName from app/build.gradle!"
            exit 1
          fi
          echo "Parsed versionName: '$VERSION_NAME'"

          IS_TAG_RELEASE="${{ steps.get_version.outputs.is_tag_release }}"
          TAG_NAME="${{ steps.get_version.outputs.tag }}"

          if [ "$IS_TAG_RELEASE" = "true" ]; then
            EXPECTED_TAG="v${VERSION_NAME}"
            if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
              echo "❌ Error: Release tag ${TAG_NAME} does not match app versionName ${VERSION_NAME}."
              exit 1
            fi
            echo "✅ Success: Tag matches app versionName."
          else
            # For workflow_dispatch, if manual_version is provided, validate it.
            MANUAL_VERSION="${{ inputs.manual_version }}"
            if [ -n "$MANUAL_VERSION" ]; then
              if [ "$MANUAL_VERSION" != "$VERSION_NAME" ]; then
                echo "❌ Error: Manual version input '${MANUAL_VERSION}' does not match app versionName '${VERSION_NAME}'."
                exit 1
              fi
              echo "✅ Success: Manual version matches app versionName."
            else
              echo "ℹ️ No manual version input provided for validation."
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  release:
    name: Build, Sign, and Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64_PRIMARY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64_FALLBACK: ${{ secrets.KEYSTORE_FILE }}
        run: |
          KEYSTORE_BASE64="${KEYSTORE_BASE64_PRIMARY:-$KEYSTORE_BASE64_FALLBACK}"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 (or KEYSTORE_FILE) secret is missing!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/erikraft-release.jks"
          echo "✅ Keystore reconstructed successfully."

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Signed Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/erikraft-release.jks
          KEYSTORE_PASSWORD_PRIMARY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD_FALLBACK: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PRIMARY: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS_FALLBACK: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_PRIMARY: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASSWORD_FALLBACK: ${{ secrets.KEY_PASSWORD }}
          SIGNING_REQUIRED: "true"
        run: |
          export KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD_PRIMARY:-$KEYSTORE_PASSWORD_FALLBACK}"
          export KEY_ALIAS="${KEY_ALIAS_PRIMARY:-$KEY_ALIAS_FALLBACK}"
          export KEY_PASSWORD="${KEY_PASSWORD_PRIMARY:-$KEY_PASSWORD_FALLBACK}"
          ./gradlew clean assembleRelease bundleRelease

      - name: Copy and Rename Artifacts
        run: |
          # Copy the mobile flavor artifacts to their standard generic and tagged names
          cp app/build/outputs/apk/mobile/release/Drop-Android.apk ErikrafT-Drop-release.apk
          cp app/build/outputs/bundle/mobileRelease/app-mobile-release.aab ErikrafT-Drop-release.aab

          # Copy to tagged name
          TAG_NAME="${{ needs.validate.outputs.version_tag }}"
          cp ErikrafT-Drop-release.apk "ErikrafT-Drop-${TAG_NAME}.apk"
          cp ErikrafT-Drop-release.aab "ErikrafT-Drop-${TAG_NAME}.aab"

          echo "✅ Artifacts copied and renamed."

      - name: Verify and Validate Artifacts
        run: |
          TAG_NAME="${{ needs.validate.outputs.version_tag }}"
          # Ensure artifacts exist and are not zero bytes
          for artifact in ErikrafT-Drop-release.apk ErikrafT-Drop-release.aab "ErikrafT-Drop-${TAG_NAME}.apk" "ErikrafT-Drop-${TAG_NAME}.aab"; do
            if [ ! -f "$artifact" ]; then
              echo "❌ Error: $artifact does not exist!"
              exit 1
            fi
            if [ ! -s "$artifact" ]; then
              echo "❌ Error: $artifact is empty (0 bytes)!"
              exit 1
            fi
          done

          # Find apksigner
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_PATH" ]; then
            echo "❌ Error: apksigner not found in Android SDK!"
            exit 1
          fi

          # Verify APK signing
          echo "Verifying APK signing status..."
          "$APKSIGNER_PATH" verify --verbose ErikrafT-Drop-release.apk

          # Verify AAB signing with jarsigner
          echo "Verifying AAB signing status..."
          jarsigner -verify ErikrafT-Drop-release.aab

          echo "✅ All artifacts successfully verified and signed!"

      - name: Clean up Keystore
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/erikraft-release.jks" ]; then
            rm -f "${{ runner.temp }}/erikraft-release.jks"
            echo "🧹 Reconstructed keystore deleted."
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: erikraft-drop-apk
          path: ErikrafT-Drop-release.apk
          if-no-files-found: error

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: erikraft-drop-aab
          path: ErikrafT-Drop-release.aab
          if-no-files-found: error

      - name: Create GitHub Release and Upload Assets
        if: needs.validate.outputs.is_tag_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ErikrafT-Drop-${{ needs.validate.outputs.version_tag }}.apk
            ErikrafT-Drop-${{ needs.validate.outputs.version_tag }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
