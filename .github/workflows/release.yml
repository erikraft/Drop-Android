name: Signed APK + AAB Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and sign Android release artifacts
    if: github.repository == 'erikraft/Drop-Android'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update ErikrafT Drop web submodule
        run: git submodule update --init --remote --depth 1 ErikrafT-Drop

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK command-line tools
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not configured on the runner." >&2
            exit 1
          fi

          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=manual" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: ./gradlew clean test --no-build-cache --rerun-tasks

      - name: Run real SFTP interoperability smoke test
        timeout-minutes: 5
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server

          SFTP_ROOT="$(mktemp -d)"
          SFTP_HOME="${SFTP_ROOT}/home"
          SFTP_KEY="${SFTP_ROOT}/id_ed25519"
          SFTP_PORT=2222
          chmod 755 "${SFTP_ROOT}"
          sudo mkdir -p /run/sshd

          sudo useradd --create-home --home-dir "${SFTP_HOME}" --shell /bin/bash erikraft-ci-sftp 2>/dev/null || true
          sudo mkdir -p "${SFTP_HOME}/.ssh"
          sudo chown -R erikraft-ci-sftp:erikraft-ci-sftp "${SFTP_HOME}"

          ssh-keygen -t ed25519 -N "" -f "${SFTP_KEY}" >/dev/null
          sudo cp "${SFTP_KEY}.pub" "${SFTP_HOME}/.ssh/authorized_keys"
          sudo chown erikraft-ci-sftp:erikraft-ci-sftp "${SFTP_HOME}/.ssh/authorized_keys"
          sudo chmod 700 "${SFTP_HOME}/.ssh"
          sudo chmod 600 "${SFTP_HOME}/.ssh/authorized_keys"

          HOST_KEY="${SFTP_ROOT}/ssh_host_ed25519_key"
          ssh-keygen -t ed25519 -N "" -f "${HOST_KEY}" >/dev/null

          cat > "${SFTP_ROOT}/sshd_config" <<EOF
          Port ${SFTP_PORT}
          ListenAddress 127.0.0.1
          HostKey ${HOST_KEY}
          PidFile ${SFTP_ROOT}/sshd.pid
          AuthorizedKeysFile .ssh/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          UsePAM no
          Subsystem sftp internal-sftp
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f "${SFTP_ROOT}/sshd_config" -E "${SFTP_ROOT}/sshd.log"
          trap 'sudo kill "$(cat "${SFTP_ROOT}/sshd.pid" 2>/dev/null)" 2>/dev/null || true; rm -rf "${SFTP_ROOT}"' EXIT

          printf 'ErikrafT Drop SFTP CI payload\n' > /tmp/erikraft-drop-sftp-upload.txt
          sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "${SFTP_KEY}" -P "${SFTP_PORT}" \
            erikraft-ci-sftp@127.0.0.1 <<'EOF'
          put /tmp/erikraft-drop-sftp-upload.txt uploaded.txt
          get uploaded.txt /tmp/erikraft-drop-sftp-download.txt
          bye
          EOF

          cmp /tmp/erikraft-drop-sftp-upload.txt /tmp/erikraft-drop-sftp-download.txt

      - name: Decode signing keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "${KEYSTORE_FILE}" ]; then
            echo "KEYSTORE_FILE secret is not configured." >&2
            exit 1
          fi

          printf '%s' "${KEYSTORE_FILE}" \
            | base64 --decode \
            > "${{ runner.temp }}/erikraft-release.jks"

          if [ ! -s "${{ runner.temp }}/erikraft-release.jks" ]; then
            echo "Decoded keystore is missing or empty." >&2
            exit 1
          fi

      - name: Validate signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "${value} secret is not configured." >&2
              exit 1
            fi
          done

      - name: Build signed mobile release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/erikraft-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleMobileRelease bundleMobileRelease

      - name: Validate and prepare artifacts
        run: |
          APK_PATH="app/build/outputs/apk/mobile/release/Drop-Android.apk"
          AAB_PATH="app/build/outputs/bundle/mobileRelease/app-mobile-release.aab"

          for artifact in "${APK_PATH}" "${AAB_PATH}"; do
            if [ ! -f "${artifact}" ]; then
              echo "Missing artifact: ${artifact}" >&2
              exit 1
            fi

            if [ ! -s "${artifact}" ]; then
              echo "Zero-byte artifact: ${artifact}" >&2
              exit 1
            fi
          done

          cp "${APK_PATH}" ErikrafT-Drop-release.apk
          cp "${AAB_PATH}" ErikrafT-Drop-release.aab

          APKSIGNER_PATH=$(find "${ANDROID_HOME}/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "${APKSIGNER_PATH}" ]; then
            echo "Unable to locate apksigner in Android SDK." >&2
            exit 1
          fi

          "${APKSIGNER_PATH}" verify --verbose ErikrafT-Drop-release.apk
          jarsigner -verify ErikrafT-Drop-release.aab

          if [ "${{ steps.meta.outputs.is_tag }}" = "true" ]; then
            cp ErikrafT-Drop-release.apk \
              "ErikrafT-Drop-${{ steps.meta.outputs.tag_name }}.apk"

            cp ErikrafT-Drop-release.aab \
              "ErikrafT-Drop-${{ steps.meta.outputs.tag_name }}.aab"
          fi

      - name: Run real FTP and FTPS transfer test against signed APK
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail

            adb install -r ErikrafT-Drop-release.apk
            adb shell pm grant com.erikraft.drop android.permission.WRITE_EXTERNAL_STORAGE

            adb shell am start -n com.erikraft.drop/.FtpSettingsActivity
            sleep 2

            found=0
            for attempt in $(seq 1 10); do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb exec-out cat /sdcard/window.xml > /tmp/drop-window.xml 2>/dev/null || true

              bounds="$(python3 - <<'PY'
            import re
            from pathlib import Path
            text = Path("/tmp/drop-window.xml").read_text(errors="ignore")
            match = re.search(r'text="Iniciar servidor".*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', text)
            if not match:
                match = re.search(r'text="Start server".*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', text)
            if match:
                x1, y1, x2, y2 = map(int, match.groups())
                print(f"{(x1+x2)//2} {(y1+y2)//2}")
            PY
              )"

              if [ -n "$bounds" ]; then
                read -r tap_x tap_y <<< "$bounds"
                adb shell input tap "$tap_x" "$tap_y"
                found=1
                break
              fi

              adb shell input swipe 540 1600 540 900 500 >/dev/null 2>&1 || true
              sleep 1
            done

            if [ "$found" -ne 1 ]; then
              echo "Unable to locate the existing FTP start control in FtpSettingsActivity." >&2
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb exec-out cat /sdcard/window.xml || true
              exit 1
            fi

            for port in 2221 50000 50001 50002 50003 50004 50005 50006 50007 50008 50009 50010; do
              adb forward "tcp:$port" "tcp:$port"
            done

            for attempt in $(seq 1 30); do
              if curl --silent --show-error --fail --user admin:admin ftp://127.0.0.1:2221/ >/dev/null; then
                break
              fi
              sleep 1
              if [ "$attempt" -eq 30 ]; then
                echo "FTP server did not become reachable." >&2
                adb logcat -d -s FtpServerService:I FtpServerService:E '*:S' || true
                exit 1
              fi
            done

            printf 'ErikrafT Drop FTP/FTPS CI payload\n' > /tmp/drop-ftp-upload.txt
            rm -f /tmp/drop-ftp-download.txt /tmp/drop-ftps-download.txt

            echo "Testing plain FTP upload/download/delete"
            curl --silent --show-error --fail --user admin:admin \
              --upload-file /tmp/drop-ftp-upload.txt \
              ftp://127.0.0.1:2221/erikraft-drop-ci-ftp.txt
            curl --silent --show-error --fail --user admin:admin \
              --output /tmp/drop-ftp-download.txt \
              ftp://127.0.0.1:2221/erikraft-drop-ci-ftp.txt
            cmp /tmp/drop-ftp-upload.txt /tmp/drop-ftp-download.txt
            curl --silent --show-error --fail --user admin:admin \
              -Q 'DELE erikraft-drop-ci-ftp.txt' \
              ftp://127.0.0.1:2221/ >/dev/null

            echo "Testing explicit FTPS/TLS upload/download/delete"
            curl --silent --show-error --fail --insecure --ssl-reqd --user admin:admin \
              --upload-file /tmp/drop-ftp-upload.txt \
              ftp://127.0.0.1:2221/erikraft-drop-ci-ftps.txt
            curl --silent --show-error --fail --insecure --ssl-reqd --user admin:admin \
              --output /tmp/drop-ftps-download.txt \
              ftp://127.0.0.1:2221/erikraft-drop-ci-ftps.txt
            cmp /tmp/drop-ftp-upload.txt /tmp/drop-ftps-download.txt
            curl --silent --show-error --fail --insecure --ssl-reqd --user admin:admin \
              -Q 'DELE erikraft-drop-ci-ftps.txt' \
              ftp://127.0.0.1:2221/ >/dev/null

            echo "Real FTP and explicit FTPS transfer checks passed against the signed APK."
            adb logcat -d -s FtpServerService:I FtpServerService:E '*:S' || true

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erikraft-drop-apk
          path: ErikrafT-Drop-release.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: erikraft-drop-aab
          path: ErikrafT-Drop-release.aab
          if-no-files-found: error

      - name: Create GitHub release with signed assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ErikrafT-Drop-${{ steps.meta.outputs.tag_name }}.apk
            ErikrafT-Drop-${{ steps.meta.outputs.tag_name }}.aab

      - name: Remove temporary keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/erikraft-release.jks"
