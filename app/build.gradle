plugins {
    id 'com.android.application'
    id 'checkstyle'
    id 'com.mikepenz.aboutlibraries.plugin'
    id 'com.github.triplet.play'
}

aboutLibraries {
    android {
        registerAndroidTasks = true
    }
}

android {
    namespace 'com.erikraft.drop'
    compileSdk 36

    defaultConfig {
        applicationId "com.erikraft.drop"
        minSdkVersion 21
        targetSdkVersion 36

        versionCode 18
        versionName "10.0.1"
        applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = "Drop-Android.apk"
            }
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "device"

    productFlavors {
        mobile {
            dimension "device"
        }

        tv {
            dimension "device"
        }

        xr {
            dimension "device"
        }
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    // use Java 8 to make use of lambda-expressions, etc.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Load keystore properties from Gradle properties, optional keystore.properties, or environment variables.
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    def resolveSigningValue = { List<String> propertyNames, String envName ->
        for (propertyName in propertyNames) {
            def propertyValue = project.findProperty(propertyName)
            if (propertyValue != null && !propertyValue.toString().trim().isEmpty()) {
                return propertyValue.toString().trim()
            }
            def fileValue = keystoreProperties.getProperty(propertyName)
            if (fileValue != null && !fileValue.trim().isEmpty()) {
                return fileValue.trim()
            }
        }
        def envValue = System.getenv(envName)
        return envValue != null ? envValue.toString().trim() : null
    }

    def keystorePath = resolveSigningValue(['KEYSTORE_PATH', 'storeFile'], 'KEYSTORE_PATH')
    def keystorePassword = resolveSigningValue(['KEYSTORE_PASSWORD', 'storePassword'], 'KEYSTORE_PASSWORD')
    def signingKeyAlias = resolveSigningValue(['KEY_ALIAS', 'keyAlias'], 'KEY_ALIAS')
    def signingKeyPassword = resolveSigningValue(['KEY_PASSWORD', 'keyPassword'], 'KEY_PASSWORD')

    def isReleaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    def signingValues = [keystorePath, keystorePassword, signingKeyAlias, signingKeyPassword]
    def hasAnySigningValue = signingValues.any { it != null && !it.isEmpty() }
    def hasCompleteSigningConfig = signingValues.every { it != null && !it.isEmpty() }

    if (hasAnySigningValue && !hasCompleteSigningConfig) {
        throw new GradleException("Signing configuration is incomplete. Ensure KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD are all set.")
    }

    if (isReleaseTaskRequested && !hasCompleteSigningConfig) {
        throw new GradleException("Release build requested without signing credentials. Configure KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD.")
    }

    if (hasCompleteSigningConfig && !file(keystorePath).exists()) {
        throw new GradleException("Configured KEYSTORE_PATH does not exist.")
    }

    if (hasCompleteSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }

        buildTypes {
            release {
                // preserve existing release configuration
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                signingConfig signingConfigs.release
            }
        }
    }

    lintOptions {
        // Ignore warnings about missing translations and extra translations
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation "com.mikepenz:aboutlibraries-core:11.2.3"
    implementation "com.mikepenz:aboutlibraries:11.2.3"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.anggrayudi:storage:1.5.6'
    implementation 'com.google.zxing:core:3.5.3'
}

/*
 * own checkstyle configuration
 * Android plugin doesn't interoperate with the Checkstyle plugin
 */

tasks.register('checkstyle', Checkstyle) {
    configFile file("${project.rootDir}/checkstyle.xml")
    source 'main/java'
    source '../test/java'
    source '../androidTest/java'
    include '**/*.java'

    classpath = files()
}

tasks.named('check') {
    dependsOn tasks.named('checkstyle')
}

def playServiceAccountPath = System.getenv("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")
if (playServiceAccountPath != null && !playServiceAccountPath.isBlank()) {
    play {
        serviceAccountCredentials.set(file(playServiceAccountPath))
        track.set(System.getenv("GOOGLE_PLAY_TRACK") ?: "production")
        releaseStatus.set(System.getenv("GOOGLE_PLAY_RELEASE_STATUS") ?: "completed")
        defaultToAppBundles.set(true)
    }
}
