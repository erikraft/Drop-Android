    // Load keystore properties (optional). Supports a `keystore.properties` file at project root
    // or environment variables (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    def keystorePath = keystoreProperties.containsKey('storeFile') ? keystoreProperties.getProperty('storeFile') : System.getenv('KEYSTORE_PATH')
    def keystorePassword = keystoreProperties.containsKey('storePassword') ? keystoreProperties.getProperty('storePassword') : System.getenv('KEYSTORE_PASSWORD')
    def keyAlias = keystoreProperties.containsKey('keyAlias') ? keystoreProperties.getProperty('keyAlias') : System.getenv('KEY_ALIAS')
    def keyPassword = keystoreProperties.containsKey('keyPassword') ? keystoreProperties.getProperty('keyPassword') : System.getenv('KEY_PASSWORD')

    if (keystorePath != null && !keystorePath.toString().isEmpty()) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                if (keystorePassword != null) storePassword = keystorePassword
                if (keyAlias != null) keyAlias = keyAlias
                if (keyPassword != null) keyPassword = keyPassword
            }
        }

        buildTypes {
            release {
                // preserve existing release configuration
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                signingConfig signingConfigs.release
            }
        }
    }

    lintOptions {
        // Ignore warnings about missing translations and extra translations
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    // use Java 8 to make use of lamda-expressions, etc.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation "com.mikepenz:aboutlibraries-core:11.2.3"
    implementation "com.mikepenz:aboutlibraries:11.2.3"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.anggrayudi:storage:2.2.0'
}

/*
 * own checkstyle configuration
 * Android plugin doesn't interoperate with the Checkstyle plugin
 */

tasks.register('checkstyle', Checkstyle) {
    configFile file("${project.rootDir}/checkstyle.xml")
    source 'main/java'
    source '../test/java'
    source '../androidTest/java'
    include '**/*.java'

    classpath = files()
}

tasks.named('check') {
    dependsOn tasks.named('checkstyle')
}

def playServiceAccountPath = System.getenv("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")
if (playServiceAccountPath != null && !playServiceAccountPath.isBlank()) {
    play {
        serviceAccountCredentials.set(file(playServiceAccountPath))
        track.set(System.getenv("GOOGLE_PLAY_TRACK") ?: "production")
        releaseStatus.set(System.getenv("GOOGLE_PLAY_RELEASE_STATUS") ?: "completed")
        defaultToAppBundles.set(true)
    }
}
